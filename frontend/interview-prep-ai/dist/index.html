<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/interview-trainer-ai/interview.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interview trainer AI</title>
    <script>
      (function() {
        const storageKey = 'theme-preference';
        const darkClass = 'dark';
        const preference = localStorage.getItem(storageKey);
        const systemPreference = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        if (preference === 'dark' || (!preference && systemPreference)) {
          document.documentElement.classList.add(darkClass);
        } else {
          document.documentElement.classList.remove(darkClass);
        }
      })();
    </script>
    <script type="module" crossorigin src="/interview-trainer-ai/assets/index-CJoQz53_.js"></script>
    <link rel="stylesheet" crossorigin href="/interview-trainer-ai/assets/index-DmB_c-pl.css">
  </head>

  </body>
</html>
