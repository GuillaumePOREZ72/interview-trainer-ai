name: CI - Tests & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Run tests
        run: cd backend && npm test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Build backend
        run: cd backend && npm run build

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist

  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/interview-prep-ai/package-lock.json

      - name: Install dependencies
        run: cd frontend/interview-prep-ai && npm ci

      - name: Run tests
        run: cd frontend/interview-prep-ai && npm test
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Build frontend
        run: cd frontend/interview-prep-ai && npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/interview-prep-ai/dist

  ftp-deploy:
    name: Deploy via FTP
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Inspect frontend artifact
        run: |
          echo "Listing frontend-dist contents for debug"
          ls -laR frontend-dist || true

      - name: Prepare frontend for FTP
        run: |
          echo "Preparing deploy-frontend folder with dist contents"
          rm -rf deploy-frontend || true
          mkdir -p deploy-frontend
          # If artifact contains a top-level dist, copy it. Otherwise search for any dist/ folders inside
          if [ -d frontend-dist/dist ]; then
            cp -r frontend-dist/dist/* deploy-frontend/ || true
          else
            # enable globstar for recursive **
            bash -lc 'shopt -s globstar; cp -r frontend-dist/**/dist/* ../deploy-frontend/ 2>/dev/null || true'
            # fallback: copy everything
            cp -r frontend-dist/* deploy-frontend/ || true
          fi
          echo "deploy-frontend contents:"
          ls -la deploy-frontend || true

      - name: Download backend build
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend-dist

      - name: Deploy frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-frontend/
          server-dir: interview-app/frontend/interview-prep-ai/

      - name: Deploy backend via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend-dist/
          server-dir: interview-app/backend/
