name: CI - Tests & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Run tests
        run: cd backend && npm test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-secret' }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET || 'test-refresh-secret' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'test-key' }}

      - name: Build backend
        run: cd backend && npm run build

  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/interview-prep-ai/package-lock.json

      - name: Install dependencies
        run: cd frontend/interview-prep-ai && npm ci

      - name: Run tests
        run: cd frontend/interview-prep-ai && npm test
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:8000' }}

      - name: Build frontend
        run: cd frontend/interview-prep-ai && npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://backend.gpdev.org' }}
